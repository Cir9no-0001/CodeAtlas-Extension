<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Connect GitHub</title>
    <link rel="stylesheet" href="../dashboard/dashboard.css" />
    <style>
        body { height: auto; padding: 24px; }
        .auth-box { display: flex; flex-direction: column; gap: 12px; }
        .auth-box input {
            background: var(--panel); color: var(--text);
            border: 1px solid var(--border); border-radius: 4px; padding: 8px;
        }
        .auth-box button {
            background: var(--accent); color: var(--bg); border: none;
            border-radius: 6px; padding: 8px; cursor: pointer; font-weight: 600;
        }
        #auth-status { font-size: 12px; color: var(--text-dim); min-height: 16px; }
    </style>
</head>

<body>
    <form id="auth-form" class="auth-box">
        <p>Paste a GitHub fine-grained token for your CodeAtlas repo with
            <strong>Actions</strong> and <strong>Secrets</strong> set to read &amp; write.</p>
        <input id="pat-input" type="password" placeholder="github_pat_..." autocomplete="off" />
        <button type="submit">Connect</button>
        <p id="auth-status"></p>
    </form>
    <script type="module" src="auth.js"></script>
</body>

</html>
